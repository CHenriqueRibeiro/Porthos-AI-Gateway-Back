name: Deploy VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /root/Porthos-AI-Gateway-Back
            git fetch origin
            git reset --hard origin/main
            docker compose up -d --build
            docker exec porthos_app node src/scripts/seedBillingCatalog.js
            docker ps
