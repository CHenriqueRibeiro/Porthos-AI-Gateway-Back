name: Sync LLM Prices

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Sync prices on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /root/Porthos-AI-Gateway-Back
            docker exec porthos_app node src/scripts/syncLlmPrices.js
